name: Update data and publish

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */12 * * *'
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Restore published prices on hourly exchange updates
        if: github.event_name == 'schedule' && github.event.schedule == '15 * * * *'
        run: |
          if git cat-file -e origin/gh-pages:data/poe-ninja 2>/dev/null; then
            git restore --source=origin/gh-pages --worktree -- data/poe-ninja
          else
            node scripts/update-data-ninja.js
          fi
      - name: Update data files
        if: github.event_name != 'schedule' || github.event.schedule == '0 */12 * * *'
        run: |
          node scripts/update-data-ninja.js
      - name: Check currency exchange calculations
        run: |
          node scripts/test-exchange.js
          node scripts/test-breachstone.js
      - name: Update hourly currency exchange data
        run: node scripts/update-exchange-data.js
      - name: Restore previously published Breachstone quotes
        run: |
          if git cat-file -e origin/gh-pages:data/breachstone-prices-poe2.json 2>/dev/null; then
            git restore --source=origin/gh-pages --worktree -- data/breachstone-prices-poe2.json
          fi
      - name: Update instant-buyout Wombgift prices
        run: node scripts/update-breachstone-data.js
      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          # Generated dataset is ignored on master; force-add it for gh-pages publishing.
          if [ -d data/poe-ninja ]; then
            git add -f data/poe-ninja
          fi
          git add -f data/currency-exchange.json data/currency-exchange-poe2.json
          git add -f data/breachstone-prices-poe2.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi
          git push -f origin gh-pages
