name: Update data and publish

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Update data files
        run: |
          node scripts/update-data-ninja.js
      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          # Generated dataset is ignored on master; force-add it for gh-pages publishing.
          if [ -d data/poe-ninja ]; then
            git add -f data/poe-ninja
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi
          git push -f origin gh-pages
